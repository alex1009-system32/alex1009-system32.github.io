name: Deploy to GitHub Pages
on:
  push:
    branches: [ "main" ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # Optional als Repository-Variable setzen (Settings > Secrets and
          # variables > Actions > Variables). Ohne sie greift der Fallback in
          # src/lib/config.ts. Der GITHUB_-Praefix ist bei Actions reserviert,
          # daher PORTFOLIO_GITHUB_USERNAME.
          VITE_GITHUB_USERNAME: ${{ vars.PORTFOLIO_GITHUB_USERNAME }}
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4